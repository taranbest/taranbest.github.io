<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taran Best | IT Professional</title>
  <!-- Clean, Highly Legible Tech Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #0f172a;           /* Rich Slate Charcoal */
      --card-bg: #1e293b;         /* Lighter Card Surface */
      --accent-color: #38bdf8;     /* Sky Blue Accent */
      --accent-hover: #0284c7;     
      --accent-glow: rgba(56, 189, 248, 0.25);
      --text-main: #f8fafc;        /* High Contrast Light Text */
      --text-muted: #94a3b8;      /* Soft Muted Gray */
      --border-color: #334155;    /* Subtle Slate Border */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-color);
      background-image: 
        radial-gradient(at 10% 10%, rgba(56, 189, 248, 0.08) 0px, transparent 50%),
        radial-gradient(at 90% 90%, rgba(30, 41, 59, 0.5) 0px, transparent 50%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      width: 100%;
      max-width: 600px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
    }

    header {
      text-align: center;
      margin-bottom: 32px;
    }

    .avatar-placeholder {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 32px;
      font-weight: 800;
      margin: 0 auto 20px auto;
      box-shadow: 0 0 20px var(--accent-glow);
    }

    h1 {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 38px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
      color: #ffffff;
    }

    .subtitle {
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      color: var(--accent-color);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 2.5px;
      margin-bottom: 12px;
    }

    .location {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      padding: 4px 12px;
      border-radius: 20px;
      font-weight: 500;
    }

    .location-icon {
      width: 14px;
      height: 14px;
      fill: var(--accent-color);
    }

    .section-title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--text-muted);
      margin-bottom: 16px;
      font-weight: 600;
    }

    .links-container {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .btn-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 22px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      color: var(--text-main);
      text-decoration: none;
      transition: all 0.25s ease;
    }

    .btn-link:hover {
      background: var(--accent-color);
      border-color: var(--accent-color);
      color: #0f172a;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px var(--accent-glow);
    }

    .btn-link .link-details {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .btn-link .link-title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 700;
      font-size: 16px;
    }

    .btn-link .link-info {
      font-size: 13px;
      color: var(--text-muted);
      transition: color 0.25s ease;
    }

    .btn-link:hover .link-info {
      color: #0f172a;
    }

    .btn-link .arrow {
      font-size: 18px;
      transition: transform 0.25s ease;
    }

    .btn-link:hover .arrow {
      transform: translateX(4px);
    }

    footer {
      text-align: center;
      margin-top: 36px;
      font-size: 13px;
      color: var(--text-muted);
      border-top: 1px solid var(--border-color);
      padding-top: 20px;
    }

    @media (max-width: 480px) {
      .container {
        padding: 28px;
      }
      h1 {
        font-size: 30px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="avatar-placeholder">TB</div>
      <h1>Taran Best</h1>
      <div class="subtitle">IT Professional</div>
      <div class="location">
        <svg class="location-icon" viewBox="0 0 24 24">
          <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
        </svg>
        Oklahoma City, OK
      </div>
    </header>

    <main>
      <div class="section-title">Connect & Contact</div>
      <div class="links-container">
        
        <a href="mailto:taranbest@taranbest.com" class="btn-link">
          <div class="link-details">
            <span class="link-title">Email</span>
            <span class="link-info">taranbest@taranbest.com</span>
          </div>
          <span class="arrow">&rarr;</span>
        </a>

        <a href="https://www.linkedin.com/in/taran-best-1b2671199" target="_blank" rel="noopener noreferrer" class="btn-link">
          <div class="link-details">
            <span class="link-title">LinkedIn</span>
            <span class="link-info">linkedin.com/in/taran-best-1b2671199</span>
          </div>
          <span class="arrow">&rarr;</span>
        </a>

        <a href="https://github.com/taranbest" target="_blank" rel="noopener noreferrer" class="btn-link">
          <div class="link-details">
            <span class="link-title">GitHub</span>
            <span class="link-info">github.com/taranbest</span>
          </div>
          <span class="arrow">&rarr;</span>
        </a>

      </div>
    </main>

    <footer>
      &copy; <script>document.write(new Date().getFullYear())</script> Taran Best. All rights reserved.
    </footer>
  </div>

</body>
</html>
